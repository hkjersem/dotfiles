name: Shell regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Apple Silicon and bundled Bash
        run: |
          [[ "$(uname -m)" == arm64 ]]
          [[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" == 3.2 ]]
          for tool in python3 node jq /usr/bin/python3 /usr/bin/ruby /usr/bin/perl; do
            command -v "$tool"
          done
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' file; do
            /bin/bash -n "$file"
          done < <(git ls-files -z -- install 'macos/*.sh' 'scripts/*.sh' bash/aliases bash/bashrc)
          while IFS= read -r -d '' file; do
            /bin/zsh -f -n "$file"
          done < <(git ls-files -z -- 'zsh/*')
      - name: Lint shell scripts
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install shellcheck
          git ls-files -z -- install '*.sh' bash/aliases bash/bashrc \
            | xargs -0 shellcheck -S warning -x
      - name: Run isolated regression tests
        run: python3 -B -m unittest discover -s scripts/tests -v
